<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2082" viewBox="0 0 1440 2082" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1440" height="2082" fill="#fbfcfe"/><text x="720.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">agent-run-dashboard — auth &amp; per-user run flow</text><text x="720.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A password becomes a signed token, and then every run request is forced back through the same gate and scoped to its owner.</text><rect x="78.0" y="118" width="294" height="34" rx="9" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.6"/><text x="225.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#136b74">React UI</text><path d="M225.0,152 V2040.0" stroke="#2aa5b0" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="408.0" y="118" width="294" height="34" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/><text x="555.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#17509f">FastAPI route</text><path d="M555.0,152 V2040.0" stroke="#4285f4" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="738.0" y="118" width="294" height="34" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/><text x="885.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#552fae">current_user · auth gate</text><path d="M885.0,152 V2040.0" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="1068.0" y="118" width="294" height="34" rx="9" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.6"/><text x="1215.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#186547">SQLite</text><path d="M1215.0,152 V2040.0" stroke="#2f9e6e" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="74" y="182" width="1292" height="30" rx="9" fill="#4285f4" fill-opacity="0.10"/><text x="720" y="202" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#17509f">SIGN IN — A PASSWORD IN, A SIGNED TOKEN OUT</text><text x="390" y="243" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">POST /api/auth/login</text><path d="M237,254 L543,254" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)"/><text x="390" y="272" text-anchor="middle" font-size="11.4" fill="#6b7794">{ username, password }</text><circle cx="225.0" cy="254" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="225.0" y="258.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">1</text><text x="885" y="315" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">SELECT User WHERE username = ?</text><path d="M567,326 L1203,326" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><circle cx="555.0" cy="326" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="330.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">2</text><path d="M567,382 h30 a11 11 0 0 1 11 11 v8 a11 11 0 0 1 -11 11 h-30" stroke="#8b5cf6" stroke-width="2.1" fill="none" marker-end="url(#ah-purple)"/><text x="613" y="383" text-anchor="start" font-size="12.9" font-weight="700" fill="#552fae">verify_password()</text><text x="613" y="402" text-anchor="start" font-size="11.4" fill="#6b7794">pbkdf2_sha256 — 401 on mismatch</text><path d="M567,446 h30 a11 11 0 0 1 11 11 v8 a11 11 0 0 1 -11 11 h-30" stroke="#8b5cf6" stroke-width="2.1" fill="none" marker-end="url(#ah-purple)"/><text x="613" y="447" text-anchor="start" font-size="12.9" font-weight="700" fill="#552fae">create_token()</text><text x="613" y="466" text-anchor="start" font-size="11.4" fill="#6b7794">JWT { sub, exp: +60 min } · HS256</text><text x="390" y="499" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">200 { access_token }</text><path d="M543,510 L237,510" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><circle cx="555.0" cy="510" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="514.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">3</text><rect x="82.0" y="548" width="1276.0" height="73.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="98.0" y="572" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Register mirrors login: 400 on a blank field, 409 if the username is already taken, then it</text><text x="98.0" y="590.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">hashes the password with pbkdf2_sha256 and returns the same kind of token.</text><text x="98.0" y="608.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The HS256 key is AGENT_OPS_SECRET, which defaults to "dev-secret-change-me" — fine for dev, must be set in prod.</text><rect x="74" y="629" width="1292" height="30" rx="9" fill="#8b5cf6" fill-opacity="0.10"/><text x="720" y="649" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#552fae">EVERY /RUNS AND /STATS CALL RE-PROVES THE CALLER</text><text x="390" y="690" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">POST /api/runs</text><path d="M237,701 L543,701" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)"/><text x="390" y="719" text-anchor="middle" font-size="11.4" fill="#6b7794">Bearer &lt;JWT&gt;  +  run fields</text><circle cx="225.0" cy="701.2" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="225.0" y="705.8000000000001" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">4</text><text x="720" y="762" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">Depends(current_user)</text><path d="M567,773 L873,773" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><text x="720" y="791" text-anchor="middle" font-size="11.4" fill="#6b7794">resolved before the handler body</text><circle cx="555.0" cy="773.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="777.8000000000001" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">5</text><path d="M897,845 h30 a11 11 0 0 1 11 11 v8 a11 11 0 0 1 -11 11 h-30" stroke="#8b5cf6" stroke-width="2.1" fill="none" marker-end="url(#ah-purple)"/><text x="943" y="846" text-anchor="start" font-size="12.9" font-weight="700" fill="#552fae">decode_token(JWT)</text><text x="943" y="865" text-anchor="start" font-size="11.4" fill="#6b7794">verify HS256 signature + exp</text><rect x="412.0" y="891.2" width="946.0" height="76.8" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="428.0" y="915.2" font-size="13.2" font-weight="700" fill="#9e2b36">One gate, and every way through it that fails is a 401</text><text x="428.0" y="937.2" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">missing bearer token · signature or exp invalid · token names a user that no longer exists</text><text x="428.0" y="955.6" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">— each raises 401 here, before any run handler runs.</text><text x="1050" y="987" text-anchor="middle" font-size="12.9" font-weight="700" fill="#552fae">SELECT User by username</text><path d="M897,998 L1203,998" stroke="#8b5cf6" stroke-width="2.1" fill="none" marker-end="url(#ah-purple)"/><circle cx="885.0" cy="998.0" r="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="885.0" y="1002.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b5cf6">6</text><text x="720" y="1043" text-anchor="middle" font-size="12.9" font-weight="700" fill="#552fae">authenticated User</text><path d="M873,1054 L567,1054" stroke="#8b5cf6" stroke-width="2.1" fill="none" marker-end="url(#ah-purple)" stroke-dasharray="7 5"/><text x="720" y="1072" text-anchor="middle" font-size="11.4" fill="#6b7794">the handler now acts as this user</text><circle cx="885.0" cy="1054.0" r="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="885.0" y="1058.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b5cf6">7</text><rect x="412.0" y="1108.0" width="946.0" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="428.0" y="1132.0" font-size="13.2" font-weight="700" fill="#8c5a0d">The owner is stamped from the token, not the request</text><text x="428.0" y="1154.0" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">create_run builds Run(owner_id = user.id, **body): owner_id is taken from the</text><text x="428.0" y="1172.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">verified token, never the request body — so a caller cannot create a run for,</text><text x="428.0" y="1190.8000000000002" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">or reassign one to, another user.</text><text x="885" y="1222" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">INSERT Run (owner_id = user.id)</text><path d="M567,1233 L1203,1233" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><circle cx="555.0" cy="1233.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1237.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">8</text><text x="390" y="1278" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">201 RunOut</text><path d="M543,1289 L237,1289" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><circle cx="555.0" cy="1289.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1293.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">9</text><rect x="74" y="1323" width="1292" height="30" rx="9" fill="#2f9e6e" fill-opacity="0.10"/><text x="720" y="1343" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#186547">READS AND DELETES NEVER CROSS USERS</text><text x="390" y="1384" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">GET /api/stats</text><path d="M237,1395 L543,1395" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)"/><text x="390" y="1413" text-anchor="middle" font-size="11.4" fill="#6b7794">Bearer &lt;JWT&gt; — same gate runs first</text><circle cx="225.0" cy="1395.2" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="225.0" y="1399.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">10</text><text x="885" y="1456" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">SELECT Run WHERE owner_id = user.id</text><path d="M567,1467 L1203,1467" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><text x="885" y="1485" text-anchor="middle" font-size="11.4" fill="#6b7794">counts, tokens, cost · by_status · by_model</text><circle cx="555.0" cy="1467.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1471.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">11</text><text x="390" y="1528" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">200 Stats</text><path d="M543,1539 L237,1539" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><circle cx="555.0" cy="1539.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1543.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">12</text><text x="390" y="1584" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">DELETE /api/runs/{run_id}</text><path d="M237,1595 L543,1595" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)"/><text x="390" y="1613" text-anchor="middle" font-size="11.4" fill="#6b7794">Bearer &lt;JWT&gt;</text><circle cx="225.0" cy="1595.2" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="225.0" y="1599.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">13</text><text x="885" y="1656" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">session.get(Run, run_id)</text><path d="M567,1667 L1203,1667" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><circle cx="555.0" cy="1667.2" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1671.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">14</text><text x="885" y="1712" text-anchor="middle" font-size="12.9" font-weight="700" fill="#186547">Run row (any owner)</text><path d="M1203,1723 L567,1723" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)" stroke-dasharray="7 5"/><circle cx="1215.0" cy="1723.2" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="1215.0" y="1727.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">15</text><rect x="414" y="1753" width="942" height="165" rx="12" fill="#e0a13a" fill-opacity="0.05" stroke="#e0a13a" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="414" y="1753" width="311" height="23" rx="9" fill="#e0a13a" fill-opacity="0.16"/><text x="427" y="1769" font-size="12" font-weight="700" fill="#8c5a0d">ownership check runs in Python, not the query</text><rect x="430.0" y="1803.2" width="910.0" height="54.8" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="446.0" y="1827.2" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">if run is None or run.owner_id != user.id  →  raise 404 "run not found".</text><text x="446.0" y="1845.6000000000001" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">It returns 404, never 403, so it never reveals that the id exists for a different user.</text><text x="885" y="1877" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">DELETE Run   (only when owned)</text><path d="M567,1888 L1203,1888" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)"/><circle cx="555.0" cy="1888.0" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1892.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">16</text><text x="390" y="1947" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">204 No Content</text><path d="M543,1958 L237,1958" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><circle cx="555.0" cy="1958.0" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="555.0" y="1962.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">17</text><text x="720.0" y="2064" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/agent-run-dashboard</text></svg>